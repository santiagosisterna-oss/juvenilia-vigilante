name: Vigilante

# Una vez por hora. La corrida NO termina enseguida: se queda despierta 5 h 30
# chequeando cada 3 minutos, así que el monitoreo es continuo aunque GitHub
# dispare tarde. Los horarios muy seguidos (cada 5 minutos) GitHub los puede
# saltear directamente; los espaciados son confiables.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# La corrida nueva reemplaza a la anterior: nunca hay dos a la vez, y no queda
# hueco entre el fin de una y el arranque de la siguiente.
concurrency:
  group: vigilante
  cancel-in-progress: true

permissions:
  contents: write           # para guardar estado.json

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # 5 h 50; la corrida se corta sola a las 5 h 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preparar el guardado del estado
        run: |
          git config user.name "Vigilante"
          git config user.email "vigilante@juvenilia.online"

      - name: Vigilar los tres sistemas
        env:
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          AVISAR_A: ${{ secrets.AVISAR_A }}
        run: node vigilante.mjs --continuo
